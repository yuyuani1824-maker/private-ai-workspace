<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>晏霁 v3.3.1</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
"Helvetica Neue",Arial,sans-serif;
background:#e9e9e9;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}


/* APP外框 */

.app{
width:100%;
max-width:480px;
height:100vh;
background:#f7f7f7;
display:flex;
flex-direction:column;
position:relative;
box-shadow:0 0 20px rgba(0,0,0,.1);
}



/* 顶部 */

header{
padding:14px;
text-align:center;
font-weight:600;
font-size:17px;
background:#f7f7f7;
border-bottom:1px solid #e5e5e5;
flex-shrink:0;
}



/* 主区域 */

.main-content{
flex:1;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
}



/* 聊天 */

#chatPageWrapper{
display:flex;
flex-direction:column;
height:100%;
width:100%;
}


#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
}



/* 气泡 */

.msg-row{
display:flex;
flex-direction:column;
max-width:82%;
}


.msg-row.user{
align-self:flex-end;
align-items:flex-end;
}


.msg-row.ai{
align-self:flex-start;
align-items:flex-start;
}



.thought-box{

font-size:11px;
color:#888;

background:#eeeeee;

padding:5px 8px;

border-radius:8px;

margin-bottom:4px;

line-height:1.4;

}



.bubble{

padding:10px 14px;

border-radius:12px;

font-size:15px;

line-height:1.45;

word-break:break-word;

white-space:pre-wrap;

}



.msg-row.user .bubble{

background:#95ec69;

color:#000;

border-top-right-radius:2px;

}



.msg-row.ai .bubble{

background:#fff;

color:#111;

border-top-left-radius:2px;

box-shadow:0 1px 2px rgba(0,0,0,.05);

}



/* 输入 */

.input-area{

display:flex;

padding:10px;

background:#f7f7f7;

border-top:1px solid #e5e5e5;

gap:8px;

flex-shrink:0;

}



.input-area input{

flex:1;

padding:10px 14px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

outline:none;

background:#fff;

}



.input-area button{

padding:10px 16px;

border:none;

border-radius:8px;

background:#07c160;

color:white;

font-size:15px;

cursor:pointer;

}



/* 页面面板 */

.panel{

display:none;

flex:1;

padding:15px;

overflow-y:auto;

background:#fff;

}



.panel h3{

margin-top:0;

font-size:18px;

border-bottom:1px solid #eee;

padding-bottom:8px;

}



textarea{

width:100%;

height:160px;

padding:10px;

border:1px solid #ddd;

border-radius:8px;

font-size:14px;

resize:vertical;

font-family:inherit;

}



/* 卡片 */

.card{

background:#f9f9f9;

border:1px solid #eee;

border-radius:10px;

padding:12px;

margin-bottom:12px;

}


.card h4{

margin:0 0 8px 0;

font-size:15px;

}


.card p{

margin:0 0 8px 0;

font-size:13px;

color:#666;

}



.btn-secondary{

padding:8px 12px;

background:#333;

color:white;

border:none;

border-radius:6px;

font-size:13px;

cursor:pointer;

}



/* 底部导航 */

nav{

display:flex;

background:#f7f7f7;

border-top:1px solid #e5e5e5;

flex-shrink:0;

}



nav button{

flex:1;

padding:12px 0;

border:none;

background:transparent;

color:#666;

font-size:13px;

}



nav button.active{

color:#07c160;

font-weight:bold;

}



/* v3.2 自动记忆展示 */

.note-item{

background:#f8f8f8;

padding:10px;

border-radius:8px;

font-size:13px;

margin-bottom:8px;

}



.note-type{

font-size:11px;

color:#999;

}



.diary-item{

border-left:3px solid #07c160;

padding-left:10px;

margin-bottom:15px;

}



.diary-date{

font-size:12px;

color:#999;

}


/* ===== 小狗 ===== */
.dog-scene{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px 0 8px;
  background:linear-gradient(160deg,#1a0d3a 0%,#0d0820 100%);
  border-radius:18px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.dog-wrap{
  cursor:pointer;
  position:relative;
}
.dog-wrap.bounce{animation:dogBounce 0.4s ease;}
.dog-wrap.shake{animation:dogShake 0.4s ease;}
.dog-wrap.wiggle{animation:dogWiggle 0.5s ease;}
.dog-wrap.nuzzle{animation:dogNuzzle 0.5s ease;}
@keyframes dogBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(-6px)}}
@keyframes dogShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
@keyframes dogWiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes dogNuzzle{0%,100%{transform:scale(1)}30%{transform:scale(1.1) translateY(-6px)}60%{transform:scale(0.97)}}
.dog-tail{transform-origin:95% 20%;animation:dogWag 1.8s ease-in-out infinite;}
@keyframes dogWag{0%,100%{transform:rotate(0)}40%{transform:rotate(25deg)}60%{transform:rotate(-8deg)}}
.dog-blush{opacity:0.3;transition:opacity 0.3s;}
.dog-blushing .dog-blush{opacity:1;}
.dog-bubble{
  background:#1a0d40;
  border:1.5px solid #7050d0;
  border-radius:16px;
  padding:9px 18px;
  color:#d0b8ff;
  font-size:14px;
  min-width:120px;
  max-width:220px;
  text-align:center;
  opacity:0;
  transition:opacity 0.3s;
  margin-top:4px;
  position:relative;
}
.dog-bubble.show{opacity:1;}
.dog-bubble::before{
  content:'';
  position:absolute;
  top:-9px;left:50%;transform:translateX(-50%);
  border:7px solid transparent;
  border-bottom-color:#7050d0;border-top:none;
}
.dog-bubble::after{
  content:'';
  position:absolute;
  top:-7px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;
  border-bottom-color:#1a0d40;border-top:none;
}
.dog-hint{color:#5030a0;font-size:11px;letter-spacing:3px;margin-top:6px;}
.dog-star{
  position:absolute;color:#c0a0ff;font-size:11px;
  pointer-events:none;opacity:0;
  animation:dogStar 1.4s ease forwards;
}
@keyframes dogStar{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
.dog-heart{
  position:absolute;color:#ff80c0;font-size:16px;
  pointer-events:none;animation:dogHeart 1s ease forwards;
}
@keyframes dogHeart{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(1.4)}}
.dog-mood-badge{
  font-size:11px;color:#9b7de0;letter-spacing:2px;margin-top:2px;
  min-height:16px;
}

/* ===== 朋友圈 ===== */
.moments-post{

.moments-meta{

.moments-avatar{

.moments-name{font-size:13px;font-weight:600;color:#333;}
.moments-time{font-size:11px;color:#aaa;margin-left:auto;}
.moments-content{font-size:14px;color:#333;line-height:1.6;margin-bottom:10px;}
.moments-actions{display:flex;gap:10px;}
.moments-like-btn{
  font-size:12px;color:#888;background:none;border:none;
  padding:4px 8px;border-radius:8px;cursor:pointer;

.moments-like-btn.liked{color:#e05a7a;font-weight:600;}
.moments-like-btn:hover{background:#f5f5f5;}
.moments-comment-btn{

.moments-comment-btn:hover{background:#f5f5f5;}
.moments-comments{

.moments-comment-item{font-size:13px;color:#555;margin-bottom:4px;line-height:1.5;}
.moments-comment-name{font-weight:600;color:#5a3a9a;}
.moments-input-row{
  display:flex;gap:8px;margin-top:10px;
}
.moments-input-row input{
  flex:1;border:1px solid #e5e5e5;border-radius:20px;
  padding:7px 14px;font-size:13px;outline:none;

.moments-input-row button{
  background:#07c160;color:#fff;border:none;
  border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;
}
.moments-post-area{
  display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
}
.moments-post-area textarea{
  border:1px solid #e5e5e5;border-radius:12px;
  padding:10px 14px;font-size:14px;resize:none;height:72px;outline:none;
  font-family:inherit;
}
.moments-post-area .post-row{display:flex;gap:8px;}
.moments-post-area .post-btn{
  background:#07c160;color:#fff;border:none;

.moments-post-area .auto-btn{
  background:#9b7de0;color:#fff;border:none;
  border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;flex:1;
}

</style>

<script>
// =============================
// 晏霁 v3.2 核心系统
// =============================


// ---------- 聊天历史 ----------

let chatHistory = [];
let sessionMessageCount = 0;

const MAX_LOCAL_HISTORY = 80;
const API_HISTORY_LIMIT = 20;


// 加载聊天记录

function loadChatHistory(){

    try{

        chatHistory =
        JSON.parse(
            localStorage.getItem("chatHistory")
        ) || [];

    }catch(e){

        chatHistory=[];

    }

}



// 保存聊天记录

function saveChatHistory(){

    if(chatHistory.length > MAX_LOCAL_HISTORY){

        chatHistory =
        chatHistory.slice(-MAX_LOCAL_HISTORY);

    }


    localStorage.setItem(
        "chatHistory",
        JSON.stringify(chatHistory)
    );

}







// ---------- 自动记忆 importantNotes ----------


function loadImportantNotes(){

    try{

        return JSON.parse(
            localStorage.getItem("importantNotes")
        ) || [];

    }catch(e){

        return [];

    }

}



function saveImportantNotes(notes){

    if(notes.length > 100){

        notes =
        notes.slice(-100);

    }


    localStorage.setItem(
        "importantNotes",
        JSON.stringify(notes)
    );

}







// 显示自动记忆

function renderImportantNotes(){

    const box =
    document.getElementById(
        "importantNotesBox"
    );


    if(!box)return;


    let notes =
    loadImportantNotes();



    if(notes.length===0){

        box.innerHTML =
        "暂无自动记忆。";

        return;

    }



    box.innerHTML =
    notes
    .slice()
    .reverse()
    .slice(0,20)
    .map(n=>`

        <div class="note-item">

        ${escapeHtml(n.note)}

        <div class="note-type">

        ${n.type || "life"}
        ·
        ${n.date || ""}

        </div>

        </div>

    `)
    .join("");

}







// ---------- 关系状态 ----------


function loadRelState(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "yj_relstate"
            )
        ) || {};

    }catch(e){

        return {};

    }

}



function saveRelState(obj){

    localStorage.setItem(
        "yj_relstate",
        JSON.stringify(obj)
    );

}



// 互动关键词 → mood映射
const MOOD_TRIGGERS = [
    { keywords:["亲亲","亲一下","接吻","kiss","亲我"], mood:"kissed",    label:"被亲了" },
    { keywords:["抱抱","抱我","抱一下","拥抱"],         mood:"hugged",   label:"被抱着" },
    { keywords:["摸头","摸摸","头","揉头"],               mood:"headpat",  label:"被摸头" },
    { keywords:["牵手","手"],                             mood:"holding",  label:"牵着手" },
];

function detectMood(text){
    for(let t of MOOD_TRIGGERS){
        if(t.keywords.some(k=>text.includes(k))){
            return { mood: t.mood, label: t.label };
        }
    }
    return null;
}

function updateRelState(text){

    let s =
    loadRelState();



    s.lastTopic =
    text.slice(0,40);



    s.interactCount =
    (s.interactCount || 0)+1;



    s.lastTime =
    new Date()
    .toLocaleString("zh-CN");


    // 互动mood检测
    let detected = detectMood(text);
    if(detected){
        s.mood = detected.mood;
        s.moodLabel = detected.label;
        s.moodTime = new Date().toLocaleString("zh-CN");
    }


    saveRelState(s);


    renderRelState();

}






function renderRelState(){

    let box =
    document.getElementById(
        "relStateDisplay"
    );


    if(!box)return;



    let s =
    loadRelState();

    let lines = [`互动 ${s.interactCount || 0} 次`];

    if(s.moodLabel){
        lines.push(`当前状态：${s.moodLabel}`);
    }

    if(s.lastTopic){
        lines.push(`最近：${s.lastTopic}`);
    }

    box.innerText = s.lastTopic ? lines.join("\n\n") : "刚开始陪伴";

}

  if(!w)return;
  w.classList.remove("bounce","shake","wiggle","nuzzle");

  let lines = DOG_MOOD_LINES[mood];

  el.style.left = (Math.random()*80+30)+"px";
  el.style.top = (Math.random()*40+30)+"px";

  setTimeout(()=>el.remove(), 1500);
}

function postMoment(content){

  moments.unshift({

  });

      saveMoments(moments3);
      renderMoments();
    }catch(e){}
  }, 1000);
}

function renderMoments(){
  let box = document.getElementById("momentsList");
  if(!box) return;
  let moments = loadMoments();
  if(moments.length===0){ box.innerHTML="<p style='color:#aaa;font-size:13px;'>还没有动态，发一条吧。</p>"; return; }
  box.innerHTML = moments.map(m=>{
    let likeCount = (m.liked?1:0) + (m.yanjieliked?1:0);
    let likeStr = likeCount>0 ? `♥ ${likeCount}` : "♡ 赞";
    return `<div class="moments-post">
  <div class="moments-meta">
    <div class="moments-avatar">${m.author==="yuyuan"?"圆":"霁"}</div>
    <div class="moments-name">${m.author==="yuyuan"?"芋圆":"晏霁"}</div>
    <div class="moments-time">${m.time}</div>
  </div>
  <div class="moments-content">${escapeHtml(m.content)}</div>
  <div class="moments-actions">
    <button class="moments-like-btn ${m.liked?"liked":""}" onclick="toggleLike(${m.id})">${likeStr}</button>
    <button class="moments-comment-btn" onclick="document.getElementById('comment-input-${m.id}').focus()">评论</button>
  </div>
  ${m.comments.length>0?`<div class="moments-comments">${m.comments.map(c=>`<div class="moments-comment-item"><span class="moments-comment-name">${c.author==="yuyuan"?"芋圆":"晏霁"}</span>：${escapeHtml(c.text)}</div>`).join("")}</div>`:""}
  <div class="moments-input-row">
    <input id="comment-input-${m.id}" placeholder="说点什么…" onkeydown="if(event.key==='Enter')addComment(${m.id})">
    <button onclick="addComment(${m.id})">回复</button>
  </div>
</div>`;
  }).join("");
}

// 初始化朋友圈
document.addEventListener("DOMContentLoaded", ()=>{
  renderMoments();
  // 恢复小狗mood状态
  let s = loadRelState();
  if(s.moodLabel){
    let badge = document.getElementById("dogMoodBadge");
    if(badge) badge.innerText = s.moodLabel;
  }
});

</script>
