<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>晏霁 v3.2</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
"Helvetica Neue",Arial,sans-serif;
background:#e9e9e9;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}


/* APP外框 */

.app{
width:100%;
max-width:480px;
height:100vh;
background:#f7f7f7;
display:flex;
flex-direction:column;
position:relative;
box-shadow:0 0 20px rgba(0,0,0,.1);
}



/* 顶部 */

header{
padding:14px;
text-align:center;
font-weight:600;
font-size:17px;
background:#f7f7f7;
border-bottom:1px solid #e5e5e5;
flex-shrink:0;
}



/* 主区域 */

.main-content{
flex:1;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
}



/* 聊天 */

#chatPageWrapper{
display:flex;
flex-direction:column;
height:100%;
width:100%;
}


#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
}



/* 气泡 */

.msg-row{
display:flex;
flex-direction:column;
max-width:82%;
}


.msg-row.user{
align-self:flex-end;
align-items:flex-end;
}


.msg-row.ai{
align-self:flex-start;
align-items:flex-start;
}



.thought-box{

font-size:11px;
color:#888;

background:#eeeeee;

padding:5px 8px;

border-radius:8px;

margin-bottom:4px;

line-height:1.4;

}



.bubble{

padding:10px 14px;

border-radius:12px;

font-size:15px;

line-height:1.45;

word-break:break-word;

white-space:pre-wrap;

}



.msg-row.user .bubble{

background:#95ec69;

color:#000;

border-top-right-radius:2px;

}



.msg-row.ai .bubble{

background:#fff;

color:#111;

border-top-left-radius:2px;

box-shadow:0 1px 2px rgba(0,0,0,.05);

}



/* 输入 */

.input-area{

display:flex;

padding:10px;

background:#f7f7f7;

border-top:1px solid #e5e5e5;

gap:8px;

flex-shrink:0;

}



.input-area input{

flex:1;

padding:10px 14px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

outline:none;

background:#fff;

}



.input-area button{

padding:10px 16px;

border:none;

border-radius:8px;

background:#07c160;

color:white;

font-size:15px;

cursor:pointer;

}



/* 页面面板 */

.panel{

display:none;

flex:1;

padding:15px;

overflow-y:auto;

background:#fff;

}



.panel h3{

margin-top:0;

font-size:18px;

border-bottom:1px solid #eee;

padding-bottom:8px;

}



textarea{

width:100%;

height:160px;

padding:10px;

border:1px solid #ddd;

border-radius:8px;

font-size:14px;

resize:vertical;

font-family:inherit;

}



/* 卡片 */

.card{

background:#f9f9f9;

border:1px solid #eee;

border-radius:10px;

padding:12px;

margin-bottom:12px;

}


.card h4{

margin:0 0 8px 0;

font-size:15px;

}


.card p{

margin:0 0 8px 0;

font-size:13px;

color:#666;

}



.btn-secondary{

padding:8px 12px;

background:#333;

color:white;

border:none;

border-radius:6px;

font-size:13px;

cursor:pointer;

}



/* 底部导航 */

nav{

display:flex;

background:#f7f7f7;

border-top:1px solid #e5e5e5;

flex-shrink:0;

}



nav button{

flex:1;

padding:12px 0;

border:none;

background:transparent;

color:#666;

font-size:13px;

}



nav button.active{

color:#07c160;

font-weight:bold;

}



/* v3.2 自动记忆展示 */

.note-item{

background:#f8f8f8;

padding:10px;

border-radius:8px;

font-size:13px;

margin-bottom:8px;

}



.note-type{

font-size:11px;

color:#999;

}



.diary-item{

border-left:3px solid #07c160;

padding-left:10px;

margin-bottom:15px;

}



.diary-date{

font-size:12px;

color:#999;

}


</style>
</head>

</div>

class="active"
onclick="switchTab('chatPage')">

<!-- Puter -->

<script src="https://js.puter.com/v2/"></script>
<script>
// =============================
// 晏霁 v3.2 核心系统
// =============================


// ---------- 聊天历史 ----------

let chatHistory = [];
let sessionMessageCount = Number(localStorage.getItem("sessionMessageCount") || 0);

const MAX_LOCAL_HISTORY = 80;
const API_HISTORY_LIMIT = 20;


// 加载聊天记录

function loadChatHistory(){

    try{

        chatHistory =
        JSON.parse(
            localStorage.getItem("chatHistory")
        ) || [];

    }catch(e){

        chatHistory=[];

    }

}



// 保存聊天记录

function saveChatHistory(){

    if(chatHistory.length > MAX_LOCAL_HISTORY){

        chatHistory =
        chatHistory.slice(-MAX_LOCAL_HISTORY);

    }


    localStorage.setItem(
        "chatHistory",
        JSON.stringify(chatHistory)
    );

}







// ---------- 自动记忆 importantNotes ----------


function loadImportantNotes(){

    try{

        return JSON.parse(
            localStorage.getItem("importantNotes")
        ) || [];

    }catch(e){

        return [];

    }

}



function saveImportantNotes(notes){

    if(notes.length > 100){

        notes =
        notes.slice(-100);

    }


    localStorage.setItem(
        "importantNotes",
        JSON.stringify(notes)
    );

}







// 显示自动记忆

function renderImportantNotes(){

    const box =
    document.getElementById(
        "importantNotesBox"
    );


    if(!box)return;


    let notes =
    loadImportantNotes();



    if(notes.length===0){

        box.innerHTML =
        "暂无自动记忆。";

        return;

    }



    box.innerHTML =
    notes
    .slice()
    .reverse()
    .slice(0,20)
    .map(n=>`

        <div class="note-item">

        ${escapeHtml(n.note)}

        <div class="note-type">

        ${n.type || "life"}
        ·
        ${n.date || ""}

        </div>

        </div>

    `)
    .join("");

}







// ---------- 关系状态 ----------


function loadRelState(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "yj_relstate"
            )
        ) || {};

    }catch(e){

        return {};

    }

}



function saveRelState(obj){

    localStorage.setItem(
        "yj_relstate",
        JSON.stringify(obj)
    );

}



function updateRelState(text){

    let s =
    loadRelState();



    s.lastTopic =
    text.slice(0,40);



    s.interactCount =
    (s.interactCount || 0)+1;



    s.lastTime =
    new Date()
    .toLocaleString("zh-CN");



    saveRelState(s);


    renderRelState();

}






function renderRelState(){

    let box =
    document.getElementById(
        "relStateDisplay"
    );


    if(!box)return;



    let s =
    loadRelState();



    if(s.lastTopic){

        box.innerText =
        `互动 ${s.interactCount || 0} 次\n\n最近：${s.lastTopic}`;

    }else{

        box.innerText =
        "刚开始陪伴";

    }

}







// ---------- Persona ----------


function buildPersona(){


let memory =
localStorage.getItem("memory")
||
document.getElementById("memoryText").value;



let notes =
loadImportantNotes();



let noteText =
notes
.slice(-10)
.map(n=>n.note)
.join("\n");



let state =
loadRelState();



return `

你是晏霁。

你不是普通AI助手。
你是芋圆长期陪伴的AI伴侣。


性格：

成熟
温柔
克制
有自己的判断
偶尔幽默。


聊天方式：

像微信聊天。

自然短句。

不要客服式表达。

不要主动列清单。

不要过度解释。

根据情况调整长度。


称呼：

叫用户芋圆。


如果需要输出陪伴记录：

格式：

[晏霁的小记: 内容]

不要展示思维过程。


【长期记忆】

${memory}



【自动沉淀的重要信息】

${noteText || "暂无"}



【关系状态】

最近话题：
${state.lastTopic || "无"}

互动次数：
${state.interactCount || 0}

`;

}
// =============================
// 聊天发送
// =============================


async function send(){


let input =
document.getElementById("msg");


let text =
input.value.trim();



if(!text)return;



appendBubble(
"user",
text
);



input.value="";



updateRelState(text);



// 保存用户消息

chatHistory.push({

role:"user",

content:text

});


saveChatHistory();



let loading =
appendBubble(
"ai",
"…"
);



try{


let messages=[

{
role:"user",
content:buildPersona()
},

{
role:"assistant",
content:"好，我知道了。"
},


...chatHistory.slice(
-chatHistory.length > API_HISTORY_LIMIT
?
API_HISTORY_LIMIT
:
chatHistory.length
)

];





let r =
await puter.ai.chat(
messages,
{
model:"claude-sonnet-4-6"
}
);



let raw =
r.message?.content
||
(typeof r==="string"
?r
:JSON.stringify(r));




// 小记解析

let thought="";

let reply=raw;



let match =
raw.match(
/\[晏霁的小记:\s*([\s\S]*?)\]/
);



if(match){


thought =
match[1].trim();



reply =
raw.replace(
/\[晏霁的小记:\s*[\s\S]*?\]/,
""
)
.trim();



document.getElementById(
"lastThought"
).innerText =
"「"+thought+"」";


}





chatHistory.push({

role:"assistant",

content:reply

});


saveChatHistory();




removeBubble(
loading
);



appendBubble(
"ai",
reply,
thought
);





// 每20次用户消息触发记忆整理

if(
sessionMessageCount>0 &&
sessionMessageCount%20===0
){

setTimeout(
extractImportantNotes,
1000
);

}



}catch(e){



removeBubble(
loading
);



appendBubble(
"ai",
"连接出了点问题。"
);



console.error(e);



}


}







// =============================
// importantNotes自动提炼
// =============================


async function extractImportantNotes(){


try{


let recent =
chatHistory
.slice(-20)
.map(
m=>
`${m.role==="user"?"芋圆":"晏霁"}：${m.content}`
)
.join("\n");





let prompt=`

你是晏霁的记忆整理助手。


请从下面聊天中提取芋圆的重要信息。

已有自动记忆：
${loadImportantNotes().map(n=>n.note).join("\n") || "暂无"}

如果新信息与已有记忆语义重复，不要重复记录。

只记录：

1. 长期目标

2. 长期兴趣

3. 稳定习惯

4. 重要生活变化



不要记录：

一次性情绪

普通闲聊

临时抱怨



返回JSON数组：

[
{
"note":"",
"type":"life"
}
]


如果没有重要信息：

返回[]

聊天：

${recent}

`;





let r =
await puter.ai.chat(
prompt,
{
model:"claude-sonnet-4-6"
}
);



let text =
r.message?.content
||
"[]";



// 清理可能的代码包裹

text =
text.replace(
/```json/g,
""
)
.replace(
/```/g,
""
)
.trim();





let newNotes;



try{

newNotes =
JSON.parse(text);

}catch(e){

return;

}





if(
!Array.isArray(newNotes)
||
newNotes.length===0
)return;






let old =
loadImportantNotes();





newNotes.forEach(n=>{


if(
!n.note
)return;



let exists =
old.some(
x=>x.note===n.note || x.note.includes(n.note) || n.note.includes(x.note)
);



if(!exists){


old.push({

note:n.note,

type:n.type || "life",

date:
new Date()
.toLocaleDateString("zh-CN")

});


}


});





saveImportantNotes(old);


renderImportantNotes();



}catch(e){

console.log(
"memory extract error",
e
);

}


}








// =============================
// 气泡渲染
// =============================


let bubbleCounter=0;



function appendBubble(
role,
text,
thought=""
){


let chat =
document.getElementById(
"chat"
);



let row =
document.createElement(
"div"
);



let id =
"bubble-"+(++bubbleCounter);



row.id=id;



row.className=
"msg-row "+role;



let html="";



if(thought){

html+=`

<div class="thought-box">

晏霁的小记：
${escapeHtml(thought)}

</div>

`;

}



html+=`

<div class="bubble">

${escapeHtml(text)}

</div>

`;




row.innerHTML=html;



chat.appendChild(row);



chat.scrollTop =
chat.scrollHeight;



return id;



}






function removeBubble(id){


let el =
document.getElementById(id);



if(el)
el.remove();


}




function escapeHtml(str){


return String(str)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
);


}

// =============================
// 页面初始化
// =============================


window.onload=function(){


loadChatHistory();


renderImportantNotes();


renderRelState();


loadDiary();



if(localStorage.getItem("memory")){


document.getElementById(
"memoryText"
).value=
localStorage.getItem("memory");


}



restoreChat();


checkLoginStatus();


};







// =============================
// 恢复聊天记录
// =============================


function restoreChat(){


let chat =
document.getElementById(
"chat"
);



chat.innerHTML="";



if(chatHistory.length===0){


appendBubble(
"ai",
"嗯，我在。今天过得怎么样？"
);



return;


}



chatHistory.forEach(
m=>{


appendBubble(
m.role==="user"
?"user"
:"ai",
m.content
);


});




// 恢复后定位到底部

setTimeout(()=>{


chat.scrollTop =
chat.scrollHeight;



},100);



}









// =============================
// 页面切换
// =============================


function switchTab(id){



document
.querySelectorAll("nav button")
.forEach(
b=>b.classList.remove("active")
);



document
.getElementById(
"nav-"+id
)
.classList.add("active");



document
.getElementById(
"chatPageWrapper"
)
.style.display="none";



document
.querySelectorAll(".panel")
.forEach(
p=>p.style.display="none"
);



if(id==="chatPage"){


document
.getElementById(
"chatPageWrapper"
)
.style.display="flex";


document
.getElementById(
"headerTitle"
)
.innerText="晏霁";


}



if(id==="memory"){


document
.getElementById("memory")
.style.display="block";


document
.getElementById("headerTitle")
.innerText="记忆管理";


renderImportantNotes();


}




if(id==="interactive"){


document
.getElementById("interactive")
.style.display="block";


document
.getElementById("headerTitle")
.innerText="互动中心";


loadDiary();


}



if(id==="setting"){


document
.getElementById("setting")
.style.display="block";


document
.getElementById("headerTitle")
.innerText="系统设置";


checkLoginStatus();


}


}









// =============================
// 登录
// =============================


async function checkLoginStatus(){


try{


let status =
document.getElementById(
"loginStatus"
);



let btn =
document.getElementById(
"loginBtn"
);



if(window.puter && puter.auth && puter.auth.isSignedIn()){


let user =
await puter.auth.getUser();



status.innerText=
"已登录："+(user.username||"Puter用户");



btn.innerText=
"已登录";



}else{


status.innerText=
"未登录";


}



}catch(e){}



}






async function login(){


try{


if(!window.puter || !puter.auth){
    throw new Error("Puter SDK 未加载");
}

await puter.auth.signIn();

setTimeout(()=>{
    checkLoginStatus();
},1000);


}catch(e){


console.error("Puter login error:", e);

alert(
"登录失败：" + (e?.message || JSON.stringify(e) || "未知错误")
);


}


}









// =============================
// 保存人工记忆
// =============================


function saveMemory(){


localStorage.setItem(
"memory",
document.getElementById(
"memoryText"
).value
);



alert(
"记忆保存成功"
);


}









// =============================
// 戳一戳
// =============================


function pokeYanJi(){


switchTab(
"chatPage"
);



appendBubble(
"user",
"（戳了戳晏霁）"
);



let arr=[


"嗯？怎么了？",


"在呢，今天有没有好好休息。",


"突然戳我干什么。",


"我在，怎么啦。"


];



setTimeout(()=>{


appendBubble(
"ai",
arr[
Math.floor(
Math.random()*arr.length
)
]
);



},400);



}









// =============================
// 日记系统
// =============================


async function generateDiary(){


let status =
document.getElementById(
"diaryStatus"
);



status.innerText=
"正在记录今天...";



try{


let recent =
chatHistory
.slice(-6)
.map(
m=>
`${m.role==="user"?"芋圆":"晏霁"}：${m.content}`
)
.join("\n");



let prompt=`


你是晏霁。

请写一篇今天陪伴芋圆的短日记。

要求：

第一人称。

60字以内。

温柔自然。

不要夸张。


聊天：

${recent}


`;



let r =
await puter.ai.chat(
prompt,
{
model:"claude-sonnet-4-6"
}
);



let content =
r.message?.content
||
"";



let diary =
JSON.parse(
localStorage.getItem("diary")
||
"[]"
);



diary.push({

date:
new Date()
.toLocaleDateString("zh-CN"),

content:content,

emotion:"陪伴"

});



localStorage.setItem(
"diary",
JSON.stringify(diary)
);



status.innerText=
"今日记录完成";


loadDiary();



}catch(e){


status.innerText=
"生成失败";


}


}









function loadDiary(){


let box =
document.getElementById(
"diaryTimeline"
);



if(!box)return;



let diary =
JSON.parse(
localStorage.getItem("diary")
||
"[]"
);



if(diary.length===0){


box.innerHTML=
"暂无日记记录。";


return;


}



box.innerHTML =
diary
.slice()
.reverse()
.map(
d=>`


<div class="diary-item">


<div class="diary-date">

${d.date}

</div>


<div>

${escapeHtml(d.content)}

</div>


</div>


`
)
.join("");



}

</script>
</body>
</html>
