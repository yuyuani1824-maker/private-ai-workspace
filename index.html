<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>私人AI工作台 v1.3</title>
<style>
body{font-family:"Microsoft YaHei",Arial;background:#f5f5f5;padding:12px}
.box{max-width:720px;margin:auto;background:white;border-radius:16px;padding:16px}
h2{text-align:center}
#chat{height:400px;overflow:auto;border:1px solid #ddd;border-radius:12px;padding:10px}
.msg{margin:8px 0;padding:10px;border-radius:10px;white-space:pre-wrap}
.user{background:#e8f1ff}
.ai{background:#eee}
textarea,input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:8px}
button{background:#333;color:white;border:0;border-radius:10px}
.small{font-size:13px;color:#666}
</style>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="box">
<h2>私人AI工作台 v1.3</h2>
<div id="status">检测中...</div>
<button onclick="login()">登录 Puter</button>

<div id="chat"></div>

<textarea id="input" placeholder="输入消息"></textarea>
<button onclick="send()">发送</button>

<hr>
<h3>AI记忆</h3>
<p class="small">填写希望 AI 长期了解的信息，例如称呼、习惯、偏好。</p>
<textarea id="memory" placeholder="例如：喜欢简洁回答，希望助手叫我芋圆"></textarea>
<button onclick="saveMemory()">保存记忆</button>
<button onclick="clearMemory()">清除记忆</button>
</div>

<script>
let memory=localStorage.getItem("ai_memory")||"";
let history=JSON.parse(localStorage.getItem("ai_history")||"[]");

document.getElementById("memory").value=memory;

function add(type,text){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=text;
 document.getElementById("chat").appendChild(d);
 document.getElementById("chat").scrollTop=999999;
}

history.forEach(x=>add(x.type,x.text));

async function check(){
 try{
  let ok=await puter.auth.isSignedIn();
  document.getElementById("status").innerText=ok?"已登录 Puter":"未登录 Puter";
 }catch(e){
  document.getElementById("status").innerText="等待登录";
 }
}
check();

async function login(){
 try{
  await puter.auth.signIn();
  check();
 }catch(e){
  alert(e.message);
 }
}

function saveMemory(){
 memory=document.getElementById("memory").value;
 localStorage.setItem("ai_memory",memory);
 alert("记忆已保存");
}

function clearMemory(){
 localStorage.removeItem("ai_memory");
 document.getElementById("memory").value="";
 alert("已清除");
}

async function send(){
 let box=document.getElementById("input");
 let text=box.value.trim();
 if(!text)return;
 box.value="";
 add("user","我："+text);
 history.push({type:"user",text:"我："+text});

 try{
 let r=await puter.ai.chat(
 `你是我的私人AI助手。
以下是用户记忆：
${localStorage.getItem("ai_memory")||"无"}

请根据这些信息帮助用户。
用户说：
${text}`,
 {model:"anthropic/claude-sonnet-4-6"}
 );

 let ans=r?.message?.content?.[0]?.text || JSON.stringify(r);
 add("ai","AI："+ans);
 history.push({type:"ai",text:"AI："+ans});
 localStorage.setItem("ai_history",JSON.stringify(history));

 }catch(e){
 add("ai","错误："+e.message);
 }
}
</script>
</body>
</html>
