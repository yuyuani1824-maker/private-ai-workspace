<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>私人AI工作台 v1.2</title>
<style>
body{font-family:Arial,"Microsoft YaHei";background:#f5f5f5;padding:12px}
.box{max-width:700px;margin:auto;background:white;padding:15px;border-radius:16px}
#chat{height:420px;overflow:auto;border:1px solid #ddd;padding:10px;border-radius:12px}
.msg{padding:10px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#e6f0ff}
.ai{background:#eee}
textarea,input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}
button{border:0;border-radius:10px;background:#333;color:white}
</style>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="box">
<h2>私人AI工作台 v1.2</h2>
<p id="status">检测登录状态...</p>
<button onclick="login()">登录 Puter</button>
<div id="chat"></div>
<textarea id="input" placeholder="输入消息"></textarea>
<button onclick="send()">发送</button>
<hr>
<input id="name" placeholder="助手名字">
<textarea id="memory" placeholder="AI记忆"></textarea>
<button onclick="save()">保存设置</button>
</div>

<script>
let settings=JSON.parse(localStorage.getItem("ai_settings")||"{}");
let history=JSON.parse(localStorage.getItem("chat_history")||"[]");

document.getElementById("name").value=settings.name||"AI助手";
document.getElementById("memory").value=settings.memory||"";

function add(type,text){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=text;
 document.getElementById("chat").appendChild(d);
 document.getElementById("chat").scrollTop=999999;
}

history.forEach(x=>add(x.type,x.text));

async function checkLogin(){
 try{
  document.getElementById("status").innerText=
  await puter.auth.isSignedIn()?"已登录 Puter":"未登录 Puter";
 }catch(e){
  document.getElementById("status").innerText="等待登录";
 }
}
checkLogin();

async function login(){
 try{
  await puter.auth.signIn();
  document.getElementById("status").innerText="已登录 Puter";
 }catch(e){
  document.getElementById("status").innerText="登录失败："+e.message;
 }
}

function save(){
 settings={
  name:document.getElementById("name").value,
  memory:document.getElementById("memory").value
 };
 localStorage.setItem("ai_settings",JSON.stringify(settings));
 alert("保存成功");
}

async function send(){
 let box=document.getElementById("input");
 let text=box.value.trim();
 if(!text)return;
 box.value="";
 add("user","我："+text);
 history.push({type:"user",text:"我："+text});

 try{
  let r=await puter.ai.chat(
  `你是${settings.name||"AI助手"}。
用户记忆：
${settings.memory||"暂无"}

用户：
${text}`,
  {model:"anthropic/claude-sonnet-4-6"}
  );

  let answer;
  if(r?.message?.content?.[0]?.text){
    answer=r.message.content[0].text;
  }else{
    answer=typeof r==="string"?r:JSON.stringify(r);
  }

  add("ai","AI："+answer);
  history.push({type:"ai",text:"AI："+answer});
  localStorage.setItem("chat_history",JSON.stringify(history));

 }catch(e){
  add("ai","错误："+e.message);
 }
}
</script>
</body>
</html>
