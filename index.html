<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>私人AI工作台 v1.4</title>
<style>
body{font-family:Microsoft YaHei,Arial;background:#f5f5f5;padding:30px}
.box{max-width:600px;margin:auto;background:#fff;padding:24px;border-radius:12px}
button{width:100%;padding:12px;background:#333;color:#fff;border:0;margin:8px 0}
textarea{width:100%;height:100px}
.chat{height:250px;border:1px solid #ddd;overflow:auto;padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>私人AI工作台 v1.4</h1>
<div id="status">正在检测 Puter...</div>
<button id="login">登录 Puter</button>
<div id="chat" class="chat"></div>
<textarea id="msg" placeholder="输入消息"></textarea>
<button id="send">发送</button>
<h3>AI助手记忆</h3>
<textarea placeholder="粘贴记忆"></textarea>
<button>保存设置</button>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
const status=document.getElementById('status');
const chat=document.getElementById('chat');

setTimeout(()=>{
 if(typeof puter!=='undefined'){
  status.innerText='Puter 已加载，请点击登录';
 }else{
  status.innerText='Puter 未加载';
 }
},1500);

document.getElementById('login').onclick=async()=>{
 try{
  await puter.auth.signIn();
  status.innerText='Puter 登录成功';
 }catch(e){
  status.innerText='登录错误：'+e.message;
 }
};

document.getElementById('send').onclick=async()=>{
 const msg=document.getElementById('msg').value;
 chat.innerHTML+='我：'+msg+'\n';
 try{
  const r=await puter.ai.chat(msg);
  chat.innerHTML+='AI：'+JSON.stringify(r)+'\n\n';
 }catch(e){
  chat.innerHTML+='错误：'+e.message+'\n\n';
 }
};
</script>
</body>
</html>
