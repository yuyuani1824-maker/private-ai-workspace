<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>晏霁 v3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#f5f5f5;height:100vh}
.app{height:100vh;max-width:600px;margin:auto;background:white;display:flex;flex-direction:column}
header{padding:16px;text-align:center;border-bottom:1px solid #eee}
#chat{flex:1;overflow:auto;padding:15px;white-space:pre-wrap}
.input{display:flex;padding:10px;border-top:1px solid #eee}
input{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px}
button{margin-left:8px;padding:12px;border:0;border-radius:8px;background:#333;color:white}
nav{display:flex;border-top:1px solid #eee}
nav button{flex:1;margin:0;border-radius:0;background:white;color:#333}
.panel{display:none;padding:15px;overflow:auto}
textarea{width:100%;height:180px}
</style>
</head>
<body>
<div class="app">
<header>晏霁</header>

<div id="chat">
</div>

<div class="input">
<input id="msg" placeholder="输入消息">
<button onclick="send()">发送</button>
</div>

<nav>
<button onclick="show('chatPage')">聊天</button>
<button onclick="show('memory')">记忆</button>
<button onclick="show('diary')">日记</button>
<button onclick="show('setting')">设置</button>
</nav>

<div id="memory" class="panel">
<h3>长期记忆</h3>
<textarea id="memoryText">用户：芋圆。
晏霁是长期陪伴型AI人格。
交流偏好：自然、短句、成熟、克制。</textarea>
<button onclick="save()">保存</button>
</div>

<div id="diary" class="panel">
<h3>日记</h3>
<p>未来用于记录重要生活片段。</p>
</div>

<div id="setting" class="panel">
<h3>设置</h3>
<p>登录与模型设置将在此管理，不影响聊天页面。</p>
<button onclick="login()">登录 Puter</button>
</div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
let persona=`你是晏霁。
你不是普通助手，而是芋圆长期陪伴的AI伴侣。
性格成熟、内敛、理性、温和。
日常聊天默认短句，不列清单，不像客服。
可以自然幽默，但不过度活泼。
不要主动展示记忆。
`;

function show(id){
document.querySelectorAll(".panel").forEach(x=>x.style.display="none");
if(id!="chatPage")document.getElementById(id).style.display="block";
}

function save(){
localStorage.memory=document.getElementById("memoryText").value;
}

async function login(){
try{
await puter.auth.signIn();
alert("登录成功");
}catch(e){alert(e.message)}
}

async function send(){
let m=document.getElementById("msg").value;
if(!m)return;
let c=document.getElementById("chat");
c.innerText+="我："+m+"\n\n";
document.getElementById("msg").value="";
try{
let r=await puter.ai.chat(persona+"\n用户："+m);
c.innerText+="晏霁："+(r.message?.content||JSON.stringify(r))+"\n\n";
}catch(e){
c.innerText+="错误："+e.message+"\n\n";
}
}
</script>
</body>
</html>
