<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>私人AI工作台 v1.7</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f5f5}
.box{width:520px;margin:40px auto;background:white;padding:25px;border-radius:12px}
button{width:100%;padding:12px;background:#333;color:white;border:0;border-radius:5px}
textarea{width:100%;height:150px;margin:10px 0}
.chat{height:260px;border:1px solid #ddd;overflow:auto;padding:10px}
</style>
</head>
<body>
<div class="box">
<h1>私人AI工作台 v1.7</h1>
<p id="status">Puter加载中，请登录</p>
<button onclick="login()">登录 Puter</button>
<div class="chat" id="chat"></div>
<textarea id="msg" placeholder="输入消息"></textarea>
<button onclick="send()">发送</button>
<h3>AI人格设定</h3>
<textarea id="persona">
你是晏霁，芋圆的私人AI伙伴。

不要主动展示你拥有的记忆。
记忆只用于理解上下文，不要重复介绍用户背景。

平时像微信聊天一样回复。
默认短句，两三句话即可。
不要写长篇总结，不要列清单，不要像客服。

闲聊简短自然；学习规划时可以详细分析。

保持温和自然的陪伴感。
不要廉价赞美，不要虚构现实行为。
不要解释自己是AI。
不要重复“我记得你”。
像长期认识的聊天对象一样交流。
</textarea>
<button onclick="save()">保存设置</button>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
let persona="";
function login(){ if(window.puter){puter.auth.signIn().then(()=>status.innerText="已登录 Puter");}}
async function send(){
let m=document.getElementById("msg").value;
document.getElementById("chat").innerHTML+="<p>我："+m+"</p>";
try{
let r=await puter.ai.chat(m,{model:"claude-sonnet-4-6",system:persona});
document.getElementById("chat").innerHTML+="<p>AI："+r.message.content[0].text+"</p>";
}catch(e){
document.getElementById("chat").innerHTML+="<p>错误："+e+"</p>";
}}
function save(){persona=document.getElementById("persona").value;alert("已保存人格设置");}
persona=document.getElementById("persona").value;
</script>
</body>
</html>
