<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>私人AI工作台 v1.4</title>
<script src="https://js.puter.com/v2/"></script>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f5f5}.box{max-width:600px;margin:40px auto;background:white;padding:24px;border-radius:12px}.chat{height:300px;border:1px solid #ddd;overflow:auto;padding:10px}.me{background:#dbeafe;padding:8px;margin:6px}.ai{background:#eee;padding:8px;margin:6px}textarea{width:100%;height:80px}button{width:100%;padding:12px;margin-top:10px;background:#333;color:white;border:0;border-radius:6px}
</style>
</head>
<body>
<div class="box">
<h1>私人AI工作台 v1.4</h1>
<div id="status">未登录 Puter</div>
<button onclick="login()">登录 Puter</button>
<div class="chat" id="chat"></div>
<textarea id="msg" placeholder="输入消息"></textarea>
<button onclick="send()">发送</button>
</div>
<script>
let ready=false;
async function login(){
 try{await puter.auth.signIn();document.getElementById('status').innerText='已登录 Puter';ready=true;}catch(e){document.getElementById('status').innerText='登录失败：'+e.message;}
}
function add(t,c){let d=document.createElement('div');d.className=c;d.innerText=t;document.getElementById('chat').appendChild(d)}
async function send(){
 let m=document.getElementById('msg').value;if(!m)return;add('我：'+m,'me');
 try{
 let r=await puter.ai.chat(m,{model:'claude-sonnet-4-6'});
 add('AI：'+(r.message?.content?.[0]?.text||JSON.stringify(r)),'ai');
 }catch(e){add('错误：'+e.message,'ai')}
}
</script>
</body>
</html>
